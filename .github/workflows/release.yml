name: DevPilot Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package VS Code extension
        working-directory: extension
        run: |
          npm ci
          npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" extension/*.vsix --generate-notes --title "DevPilot AI ${{ github.ref_name }}"
